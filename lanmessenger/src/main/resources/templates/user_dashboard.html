<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Panel-NISHAN SANDESH</title>
  <style>
    :root {
      --light-grey: #f0f2f5;
      --border-color: #e4e6eb;
      --text-primary: #050505;
      --text-secondary: #65676b;
      --primary-blue: #1877f2;
      --sent-bubble-background: #e7f3ff;
      --received-bubble-background: #ffffff;
    }
    body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--light-grey); }
    .dashboard-container { display: flex; height: 100vh; }
    .sidebar {
      width: 280px; background-color: #f8f9fa; border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
    }
    .main-content {
      flex-grow: 1; padding: 20px; display: grid;
      grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      gap: 20px; overflow-y: auto;
    }
    .sidebar h1 { font-size: 24px; margin: 0 0 30px 0; text-align: center; }
    .sidebar nav a {
      display: block; padding: 12px 15px; text-decoration: none; color: var(--text-secondary);
      font-weight: 500; border-radius: 6px; margin-bottom: 8px;
    }
    .sidebar nav a.active, .sidebar nav a:hover { background-color: #e7f3ff; color: var(--primary-blue); }

    .user-profile {
      margin-top: auto;
      padding: 15px;
      border-top: 1px solid var(--border-color);
    }
    .user-profile .username {
      font-weight: 600;
      font-size: 1.1em;
      text-align: center;
      margin-bottom: 10px;
    }
    .logout-button {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background-color: #e4e6eb; font-weight: bold; cursor: pointer;
    }

    .panel {
      background-color: #ffffff; border-radius: 8px; padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel h3 { margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-size: 18px; flex-shrink: 0; }

    /* --- UNIFIED SCROLLING STYLE for all panel content --- */
    .panel-content {
      list-style-type: none; padding: 10px; margin: 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    .user-list { display: none; }
    .user-list.visible { display: flex; }
    .user-list ul { padding: 0; } /* Remove default padding */
    .user-list li { display: flex; align-items: center; padding: 8px 15px; cursor: pointer; border-radius: 6px; }
    .user-list li:hover { background-color: #f0f2f5; }
    .status-dot { height: 10px; width: 10px; background-color: #31a24c; border-radius: 50%; margin-right: 10px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; }
    .back-to-group { font-size: 0.8em; color: var(--primary-blue); cursor: pointer; text-decoration: underline; }
    .message-item { display: flex; margin-bottom: 10px; }
    .message-bubble { padding: 10px 15px; border-radius: 18px; max-width: 70%; word-wrap: break-word; }
    .message-sender { font-weight: bold; font-size: 0.9em; margin-bottom: 4px; color: var(--primary-blue); }
    .sent { margin-left: auto; background-color: var(--sent-bubble-background); }
    .received { margin-right: auto; background-color: var(--received-bubble-background); border: 1px solid var(--border-color); }
    .event-message { width: 100%; text-align: center; color: var(--text-secondary); font-style: italic; font-size: 0.9em; }
  </style>
</head>
<body>
<div class="dashboard-container">
  <aside class="sidebar">
    <h1>NISHAN SANDESH</h1>
    <nav>
      <a href="#" class="active">Overview</a>
      <a href="#">Fault Registration</a>
    </nav>

    <div class="user-profile">
      <div class="username" th:text="${#authentication.principal.username}"></div>
      <form class="logout-form" th:action="@{/logout}" method="post">
        <button type="submit" class="logout-button">Logout</button>
      </form>
    </div>
  </aside>

  <main class="main-content">
    <div class="panel chat-panel">
      <div class="chat-header">
        <h3 id="chat-header-title">Group Chat</h3>
        <span id="back-to-group" class="back-to-group" style="display: none;">Back to Group Chat</span>
      </div>
      <!-- UPDATED: Added panel-content class -->
      <ul id="message-area" class="panel-content"></ul>
      <form id="message-form" style="display: flex; margin-top: 15px; flex-shrink: 0;">
        <input type="text" id="message-input" style="flex-grow: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc;"/>
        <button type="submit" style="border-radius: 50%; width: 40px; height: 40px; border: none; background: var(--primary-blue); color: white;">➤</button>
      </form>
    </div>

    <div class="panel upload-panel">
      <h3>File Upload</h3>
      <form id="file-upload-form">
        <div class="upload-form-group" style="margin-bottom: 15px;"><label>Choose File:</label><input type="file" id="file-input" required></div>
        <div class="upload-form-group" style="margin-bottom: 15px;"><label>Select Recipient:</label><select id="recipient-select" required><option value="">-- Select a user --</option></select></div>
        <button type="submit" class="upload-button" style="width: 100%; padding: 10px; border: none; border-radius: 6px; background-color: var(--primary-blue); color: white; font-weight: bold; cursor: pointer;">Upload File</button>
      </form>
      <div id="upload-status" style="margin-top: 15px; text-align: center; font-weight: 500;"></div>
    </div>

    <div class="panel user-list" id="user-list-panel">
      <h3>Online Users</h3>
      <!-- UPDATED: Added panel-content class -->
      <ul id="online-users-list" class="panel-content"></ul>
    </div>
    <div class="panel history-panel">
      <h3>History</h3>
      <!-- UPDATED: Added panel-content class -->
      <ul id="history-list" class="panel-content">
        <!-- History items will be added here later -->
      </ul>
    </div>
  </main>
</div>

<script th:src="@{/js/sockjs.min.js}"></script>
<script th:src="@{/js/stomp.min.js}"></script>

<script th:inline="javascript">
  const messageForm = document.getElementById('message-form');
  const messageInput = document.getElementById('message-input');
  const messageArea = document.getElementById('message-area');
  const userListPanel = document.getElementById('user-list-panel');
  const onlineUsersList = document.getElementById('online-users-list');
  const fileUploadForm = document.getElementById('file-upload-form');
  const recipientSelect = document.getElementById('recipient-select');
  const fileInput = document.getElementById('file-input');
  const uploadStatus = document.getElementById('upload-status');

  const chatHeaderTitle = document.getElementById('chat-header-title');
  const backToGroupBtn = document.getElementById('back-to-group');

  let stompClient = null;
  const username = /*[[${#authentication.principal.username}]]*/ 'defaultUser';

  const chatHistory = new Map();
  chatHistory.set('group', []);

  let currentChatTarget = 'group';

  function connect() {
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.connect({}, onConnected, () => console.error('WebSocket connection failed.'));
  }

  function onConnected() {
    stompClient.subscribe('/topic/users', onUserListReceived);
    stompClient.subscribe('/topic/public', onPublicMessageReceived);
    stompClient.subscribe('/user/' + username + '/queue/private', onPrivateMessageReceived);

    stompClient.send("/app/chat.addUser", {}, JSON.stringify({sender: username, type: 'JOIN'}));
  }

  function onUserListReceived(payload) {
    const users = JSON.parse(payload.body);
    const otherUsers = users.filter(user => user.username !== username && user.status === 'Online');

    if (otherUsers.length > 0) {
      userListPanel.classList.add('visible');
      onlineUsersList.innerHTML = '';
      otherUsers.forEach(user => {
        const userElement = document.createElement('li');
        userElement.setAttribute('onclick', `startPrivateChat('${user.username}')`);
        userElement.innerHTML = `<span class="status-dot"></span> ${user.username}`;
        onlineUsersList.appendChild(userElement);
      });
    } else {
      userListPanel.classList.remove('visible');
    }

    recipientSelect.innerHTML = '<option value="">-- Select a user --</option>';
    otherUsers.forEach(user => {
      const option = document.createElement('option');
      option.value = user.username;
      option.textContent = user.username;
      recipientSelect.appendChild(option);
    });
  }

  function onPublicMessageReceived(payload) {
    const message = JSON.parse(payload.body);
    chatHistory.get('group').push(message);
    if (currentChatTarget === 'group') {
      displayMessage(message);
    }
  }

  function onPrivateMessageReceived(payload) {
    const message = JSON.parse(payload.body);
    const sender = message.sender;

    if (!chatHistory.has(sender)) {
      chatHistory.set(sender, []);
    }
    chatHistory.get(sender).push(message);

    if (currentChatTarget === sender) {
      displayMessage(message);
    } else {
      alert(`You have a new private message from ${sender}`);
    }
  }

  function startPrivateChat(targetUsername) {
    currentChatTarget = targetUsername;
    chatHeaderTitle.textContent = `Private Chat with ${targetUsername}`;
    backToGroupBtn.style.display = 'inline';

    if (!chatHistory.has(targetUsername)) {
      chatHistory.set(targetUsername, []);
    }
    renderConversation(targetUsername);
  }

  backToGroupBtn.addEventListener('click', () => {
    currentChatTarget = 'group';
    chatHeaderTitle.textContent = 'Group Chat';
    backToGroupBtn.style.display = 'none';
    renderConversation('group');
  });

  messageForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const messageContent = messageInput.value.trim();
    if(messageContent && stompClient) {
      let chatMessage;
      if (currentChatTarget === 'group') {
        chatMessage = { sender: username, content: messageContent, type: 'CHAT' };
        stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
      } else {
        chatMessage = { sender: username, recipient: currentChatTarget, content: messageContent, type: 'PRIVATE' };
        stompClient.send("/app/chat.privateMessage", {}, JSON.stringify(chatMessage));
        chatHistory.get(currentChatTarget).push(chatMessage);
        displayMessage(chatMessage);
      }
      messageInput.value = '';
    }
  }, true);

  function displayMessage(message) {
    const messageItem = createMessageElement(message);
    messageArea.appendChild(messageItem);
    messageArea.scrollTop = messageArea.scrollHeight;
  }

  function renderConversation(target) {
    messageArea.innerHTML = '';
    const history = chatHistory.get(target);
    if (history) {
      history.forEach(message => {
        const messageItem = createMessageElement(message);
        messageArea.appendChild(messageItem);
      });
    }
    messageArea.scrollTop = messageArea.scrollHeight;
  }

  function createMessageElement(message) {
    const messageItem = document.createElement('li');
    messageItem.classList.add('message-item');

    if (message.type === 'JOIN' || message.type === 'LEAVE') {
      messageItem.classList.add('event-message');
      messageItem.textContent = `${message.sender} has ${message.type === 'JOIN' ? 'joined' : 'left'}.`;
    } else {
      const messageBubble = document.createElement('div');
      messageBubble.classList.add('message-bubble');

      if (message.sender === username) {
        messageBubble.classList.add('sent');
      } else {
        messageBubble.classList.add('received');
        const senderElement = document.createElement('div');
        senderElement.classList.add('message-sender');
        senderElement.textContent = message.sender;
        messageBubble.appendChild(senderElement);
      }

      const contentElement = document.createElement('div');
      contentElement.textContent = message.content;
      messageBubble.appendChild(contentElement);

      messageItem.appendChild(messageBubble);
    }
    return messageItem;
  }

  connect();

  fileUploadForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    const file = fileInput.files[0];
    const recipient = recipientSelect.value;

    if (!file || !recipient) {
      uploadStatus.textContent = 'Please select a file and a recipient.';
      uploadStatus.style.color = 'red';
      return;
    }

    const formData = new FormData();
    formData.append('file', file);
    formData.append('recipient', recipient);

    uploadStatus.textContent = 'Uploading...';
    uploadStatus.style.color = 'blue';

    try {
      const response = await fetch('/api/files/upload', {
        method: 'POST',
        body: formData
      });

      if (response.ok) {
        const result = await response.text();
        uploadStatus.textContent = result;
        uploadStatus.style.color = 'green';
        fileInput.value = '';
      } else {
        throw new Error('Upload failed with status: ' + response.status);
      }
    } catch (error) {
      uploadStatus.textContent = 'Error: Could not upload file.';
      uploadStatus.style.color = 'red';
      console.error('File upload error:', error);
    }
  });
</script>
</body>
</html>
