<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Panel-NISHAN SANDESH</title>
    <style>
        :root {
            --background-main: #f0f2f5;
            --background-panel: #ffffff;
            --background-sidebar: #f8f9fa;
            --border-color: #dce1e6;
            --text-primary: #1c1d21;
            --text-secondary: #606770;
            --accent-blue: #1877f2;
            --sent-bubble-background: #e7f3ff;
            --received-bubble-background: #f0f0f0;
            --panel-radius: 8px;
        }

        body, html {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-main);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-wrapper {
            display: flex;
            height: 100vh;
        }

        /* --- Sidebar --- */
        .app-sidebar {
            width: 240px;
            flex-shrink: 0;
            background-color: var(--background-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .sidebar-nav {
            flex-grow: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--panel-radius);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover {
            background-color: #e9ecef;
        }

        .nav-link.active {
            background-color: var(--accent-blue);
            color: white;
        }

        .user-profile {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .user-profile .username {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .logout-button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #e4e6eb;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- Main Content --- */
        .main-content-wrapper {
            flex-grow: 1;
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .chat-dashboard-view {
            display: flex; /* This creates the side-by-side panels */
            gap: 20px;
            height: 100%;
        }

        .chat-panel {
            flex: 1; /* Each panel takes up equal space */
            background-color: var(--background-panel);
            border-radius: var(--panel-radius);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-panel-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chat-area {
            flex-grow: 1;
            padding: 20px;
            list-style-type: none;
            margin: 0;
            overflow-y: auto;
        }

        .chat-input-form {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-input {
            flex-grow: 1;
            padding: 12px 18px;
            border: 1px solid #ccd0d5;
            border-radius: 24px;
            font-size: 15px;
        }

        /* Private Chat Specifics */
        .private-chat-container {
            display: flex;
            height: 100%;
            overflow: hidden;
        }

        .private-chat-users {
            width: 250px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .private-chat-users ul {
            list-style: none;
            padding: 10px;
            margin: 0;
        }

        .private-chat-users li {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
        }

        .private-chat-users li:hover {
            background-color: #f0f2f5;
        }

        .private-chat-users li.active {
            background-color: #e7f3ff;
            color: var(--accent-blue);
        }

        .private-chat-window {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        #private-chat-welcome {
            text-align: center;
            color: var(--text-secondary);
            margin: auto;
        }

        /* Chat Bubbles */
        .message-item { display: flex; margin-bottom: 10px; }
        .message-bubble { padding: 10px 15px; border-radius: 18px; max-width: 70%; word-wrap: break-word; }
        .message-sender { font-weight: bold; font-size: 0.9em; margin-bottom: 4px; color: var(--accent-blue); }
        .sent { margin-left: auto; background-color: var(--sent-bubble-background); }
        .received { margin-right: auto; background-color: var(--received-bubble-background); }
        .event-message { text-align: center; color: var(--text-secondary); font-style: italic; font-size: 0.9em; }

        #remove-file-btn {
            border: none;
            background: none;
            font-size: 24px;
            padding: 0 10px;
            cursor: pointer;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        #remove-file-btn:hover {
            background-color: #e4e6eb;
        }
        .private-chat-users li.unread-indicator::after {
            content: '';
            height: 9px;
            width: 9px;
            background-color: #FFA500;
            border-radius: 50%;
            margin-left: 10px;
        }
        .app-header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            /*background: #a0bdf5; !* Blue background *!*/
            color: #090a0c;
            padding: 0px;
            text-align: center;
            border-radius: 10%;
            font-weight: bold;
            font-size: 18px;
        }

    </style>
</head>
<body>
<div class="app-wrapper">
    <aside class="app-sidebar">
        <nav class="sidebar-nav">
            <header class="app-header">
                <h3 class="app-title">NISHAN SANDESH</h3>
            </header>
            <hr>
            <a href="#" id="nav-dashboard" class="nav-link active">
                <svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"></path></svg>
                <span>Dashboard</span>
            </a>
            <a href="#" id="nav-files" class="nav-link">
                <svg fill="currentColor" viewBox="0 0 24 24" width="24" height="24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 2.21 1.79 4 4 4s4-1.79 4-4V6h-1.5z"></path></svg>
                <span>File Sharing</span>
            </a>
        </nav>
        <div class="user-profile">
            <div class="username" th:text="${#authentication.principal.username}">User</div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </div>
    </aside>

    <main class="main-content-wrapper">
        <div id="chat-dashboard-view" class="chat-dashboard-view">

            <div id="group-chat-panel" class="chat-panel">
                <div class="chat-panel-header">Group Chat</div>
                <ul id="message-area" class="chat-area">
                </ul>
                <form id="message-form" class="chat-input-form">
                    <input type="text" id="message-input" class="chat-input" placeholder="Message group...">
                </form>
            </div>

            <div id="private-chat-panel" class="chat-panel">
                <div class="chat-panel-header">Private Chat</div>
                <div class="private-chat-container">
                    <div class="private-chat-users">
                        <h4 style="text-align: center;">Online Terminals</h4>
                        <hr>
                        <ul id="private-chat-user-list" >
                        </ul>
                    </div>
                    <div class="private-chat-window">
                        <p id="private-chat-welcome">Select a user to start chatting</p>
                        <ul id="private-message-area" class="chat-area" style="display: none;"></ul>
                        <form id="private-message-form" class="chat-input-form" style="display: none;">
                            <input type="text" id="private-message-input" class="chat-input" placeholder="Private message...">
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="file-sharing-view" class="file-sharing-layout" style="display: none;">
            <div class="upload-panel">
                <h3>Direct File Sharing</h3>
                <div id="drop-zone">
                    <div class="drop-zone-prompt">
                        <span style="font-size: 48px;">📤</span>
                        <p>Drag & drop file</p><small>or</small>
                        <button type="button" id="browse-btn" style="margin-top: 8px; background: none; border: 1px solid #ccd0d5; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Select File</button>
                    </div>
                </div>
                <input type="file" id="file-input-hidden" style="display: none;">
                <div id="file-preview" style="display: none;">
                    <div id="preview-thumbnail"></div>
                    <div id="preview-details">
                        <p id="preview-name"></p>
                        <small id="preview-size"></small>
                    </div>
                    <button id="remove-file-btn">&times;</button>
                </div>
                <div class="upload-actions">
                    <label for="recipient-select">Select Recipient:</label>
                    <select id="recipient-select"></select>
                    <button type="button" id="upload-btn" class="upload-button" disabled>Send File</button>
                    <div id="upload-status"></div>
                </div>
            </div>
            <aside class="incoming-files-panel">
                <h3>Incoming Files</h3>
                <ul id="incoming-files-list">
                    <li id="no-files-prompt">No incoming files.</li>
                </ul>
            </aside>
        </div>

    </main>
</div>

<script th:src="@{/js/sockjs.min.js}"></script>
<script th:src="@{/js/stomp.min.js}"></script>

<script th:inline="javascript">
    // ===================================================================================
    // SECTION 1: ELEMENT REFERENCES (ADAPTED FOR NEW UI)
    // ===================================================================================
    const username = /*[[${#authentication.principal.username}]]*/ 'user';
    let stompClient = null;

    // --- Sidebar Navigation & Main Views ---
    const navDashboard = document.querySelector('#nav-dashboard'); // Note: Using more specific query
    const navFiles = document.querySelector('#nav-files');
    const chatDashboardView = document.getElementById('chat-dashboard-view');
    const fileSharingView = document.getElementById('file-sharing-view');

    // --- Group Chat Elements ---
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const messageArea = document.getElementById('message-area');

    // --- Private Chat Elements ---
    const privateChatUserList = document.getElementById('private-chat-user-list');
    const privateChatWelcome = document.getElementById('private-chat-welcome');
    const privateMessageArea = document.getElementById('private-message-area');
    const privateMessageForm = document.getElementById('private-message-form');
    const privateMessageInput = document.getElementById('private-message-input');
    const privateChatPanelHeader = document.querySelector('#private-chat-panel .chat-panel-header');

    // --- File Sharing Elements ---
    const dropZone = document.getElementById('drop-zone');
    const browseBtn = document.getElementById('browse-btn');
    const fileInputHidden = document.getElementById('file-input-hidden');
    const filePreview = document.getElementById('file-preview');
    const previewThumbnail = document.getElementById('preview-thumbnail');
    const previewName = document.getElementById('preview-name');
    const previewSize = document.getElementById('preview-size');
    const removeFileBtn = document.getElementById('remove-file-btn');
    const recipientSelect = document.getElementById('recipient-select');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadStatus = document.getElementById('upload-status');
    const incomingFilesList = document.getElementById('incoming-files-list');
    const noFilesPrompt = document.getElementById('no-files-prompt');

    // --- Application State ---
    let selectedFile = null;
    let currentPrivateChatTarget = null;
    const chatHistory = new Map();


    // ===================================================================================
    // SECTION 2: INITIALIZATION & VIEW SWITCHING (ADAPTED FOR NEW UI)
    // ===================================================================================
    document.addEventListener('DOMContentLoaded', connect);

    navDashboard.addEventListener('click', (e) => {
        e.preventDefault();
        chatDashboardView.style.display = 'flex';
        fileSharingView.style.display = 'none';
        navDashboard.classList.add('active');
        navFiles.classList.remove('active');
        navDashboard.classList.remove('has-unread'); // Clear notification on view
    });

    navFiles.addEventListener('click', (e) => {
        e.preventDefault();
        chatDashboardView.style.display = 'none';
        fileSharingView.style.display = 'flex'; // Use flex for this layout
        navDashboard.classList.remove('active');
        navFiles.classList.add('active');
        navFiles.classList.remove('has-unread'); // Clear notification on view
    });


    // ===================================================================================
    // SECTION 3: CORE APPLICATION LOGIC (EXTRACTED FROM OLD UI)
    // ===================================================================================

    // --- WebSocket Connection ---
    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, onConnected, () => console.error('WebSocket connection failed.'));
    }

    function onConnected() {
        stompClient.subscribe('/topic/users', onUserListReceived);
        stompClient.subscribe('/topic/public', onPublicMessageReceived);
        stompClient.subscribe('/user/' + username + '/queue/private', onPrivateMessageReceived);
        stompClient.subscribe('/user/' + username + '/queue/files', onFileReceived);
        stompClient.send("/app/chat.addUser", {}, JSON.stringify({ sender: username, type: 'JOIN' }));
    }

    // --- Message & User List Handlers ---
    function onUserListReceived(payload) {
        const users = JSON.parse(payload.body);
        const otherOnlineUsers = users.filter(user => user.username !== username && user.status === 'Online');

        // Clear existing lists
        privateChatUserList.innerHTML = '';
        recipientSelect.innerHTML = '<option value="">-- Select a user --</option>';

        // Populate both lists in a single loop
        otherOnlineUsers.forEach(user => {
            // Create the list item for the private chat panel
            const li = document.createElement('li');
            li.dataset.username = user.username;
            li.textContent = user.username;
            li.onclick = () => startPrivateChat(user.username);
            privateChatUserList.appendChild(li);

            // Create the option for the file sharing dropdown
            const option = document.createElement('option');
            option.value = user.username;
            option.textContent = user.username;
            recipientSelect.appendChild(option);
        });

        updateActiveChatUser();
    }

    function onPublicMessageReceived(payload) {
        const message = JSON.parse(payload.body);
        displayMessage(message);
        if (!navDashboard.classList.contains('active')) {
            navDashboard.classList.add('has-unread');
        }
    }

    function onPrivateMessageReceived(payload) {
        const message = JSON.parse(payload.body);
        const sender = message.sender;

        if (!chatHistory.has(sender)) chatHistory.set(sender, []);
        chatHistory.get(sender).push(message);

        if (currentPrivateChatTarget === sender) {
            displayPrivateMessage(message);
        } else {
            const userListItem = document.querySelector(`.private-chat-users li[data-username="${sender}"]`);
            if (userListItem) {
                userListItem.classList.add('unread-indicator');
            }
            if (!navDashboard.classList.contains('active')) {
                navDashboard.classList.add('has-unread');
            }
        }
    }

    // --- Form Submissions ---
    messageForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const messageContent = messageInput.value.trim();
        if (messageContent && stompClient) {
            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify({ sender: username, content: messageContent, type: 'CHAT' }));
            messageInput.value = '';
        }
    });

    privateMessageForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const messageContent = privateMessageInput.value.trim();
        if (messageContent && stompClient && currentPrivateChatTarget) {
            const chatMessage = { sender: username, recipient: currentPrivateChatTarget, content: messageContent, type: 'PRIVATE' };
            stompClient.send("/app/chat.privateMessage", {}, JSON.stringify(chatMessage));
            if (!chatHistory.has(currentPrivateChatTarget)) chatHistory.set(currentPrivateChatTarget, []);
            chatHistory.get(currentPrivateChatTarget).push(chatMessage);
            displayPrivateMessage(chatMessage);
            privateMessageInput.value = '';
        }
    });

    // --- Private Chat UI Logic ---
    function startPrivateChat(targetUsername) {
        currentPrivateChatTarget = targetUsername;
        privateChatWelcome.style.display = 'none';
        privateMessageArea.style.display = 'block';
        privateMessageForm.style.display = 'flex';
        privateChatPanelHeader.textContent = `Chat with ${targetUsername}`;

        if (!chatHistory.has(targetUsername)) chatHistory.set(targetUsername, []);
        renderPrivateConversation(targetUsername);
        updateActiveChatUser();

        const userListItem = document.querySelector(`.private-chat-users li[data-username="${targetUsername}"]`);
        if (userListItem) {
            userListItem.classList.remove('unread-indicator');
        }
        // Add this line to autofocus the input
        privateMessageInput.focus();
    }

    function renderPrivateConversation(target) {
        privateMessageArea.innerHTML = '';
        const history = chatHistory.get(target) || [];
        history.forEach(msg => displayPrivateMessage(msg));
    }

    function updateActiveChatUser() {
        document.querySelectorAll('#private-chat-user-list li').forEach(li => {
            li.classList.toggle('active', li.dataset.username === currentPrivateChatTarget);
        });
    }

    // --- Message Rendering ---
    function createMessageElement(message) {
        const messageItem = document.createElement('li');
        messageItem.classList.add('message-item');

        if (message.type === 'JOIN' || message.type === 'LEAVE') {
            messageItem.classList.add('event-message');
            messageItem.textContent = `${message.sender} has ${message.type === 'JOIN' ? 'joined' : 'left'}.`;
        } else {
            const messageBubble = document.createElement('div');
            messageBubble.classList.add('message-bubble');
            if (message.sender === username) {
                messageBubble.classList.add('sent');
            } else {
                messageBubble.classList.add('received');
                const senderElement = document.createElement('div');
                senderElement.classList.add('message-sender');
                senderElement.textContent = message.sender;
                messageBubble.appendChild(senderElement);
            }
            const contentElement = document.createElement('div');
            contentElement.textContent = message.content;
            messageBubble.appendChild(contentElement);
            messageItem.appendChild(messageBubble);
        }
        return messageItem;
    }

    function displayMessage(message) {
        messageArea.appendChild(createMessageElement(message));
        messageArea.scrollTop = messageArea.scrollHeight;
    };

    function displayPrivateMessage(message) {
        privateMessageArea.appendChild(createMessageElement(message));
        privateMessageArea.scrollTop = privateMessageArea.scrollHeight;
    };


    // --- File Upload & Handling Logic ---
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    browseBtn.addEventListener('click', () => fileInputHidden.click());
    fileInputHidden.addEventListener('change', () => {
        if (fileInputHidden.files[0]) handleFile(fileInputHidden.files[0]);
    });

    function handleFile(file) {
        selectedFile = file;
        dropZone.style.display = 'none';
        filePreview.style.display = 'flex';
        uploadBtn.disabled = false;
        previewName.textContent = file.name;
        previewSize.textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = () => { previewThumbnail.innerHTML = `<img src="${reader.result}" alt="Preview">`; };
            reader.readAsDataURL(file);
        } else {
            previewThumbnail.innerHTML = '<span>📄</span>';
        }
    }

    removeFileBtn.addEventListener('click', () => {
        selectedFile = null;
        fileInputHidden.value = '';
        filePreview.style.display = 'none';
        dropZone.style.display = 'flex';
        uploadBtn.disabled = true;
        uploadStatus.textContent = '';
    });

    uploadBtn.addEventListener('click', async () => {
        if (!selectedFile || !recipientSelect.value) return;

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('recipient', recipientSelect.value);
        formData.append('sender', username);

        uploadStatus.textContent = 'Uploading...';
        try {
            const response = await fetch('/api/files/upload', { method: 'POST', body: formData });
            uploadStatus.textContent = response.ok ? `✅ File sent successfully!` : 'Error: Upload failed';
        } catch (error) {
            uploadStatus.textContent = 'Error: Could not connect to server.';
        } finally {
            setTimeout(() => removeFileBtn.click(), 3000);
        }
    });

    function onFileReceived(payload) {
        const fileData = JSON.parse(payload.body);
        if (!navFiles.classList.contains('active')) {
            navFiles.classList.add('has-unread');
        }
        if (noFilesPrompt) noFilesPrompt.style.display = 'none';

        const li = document.createElement('li');
        li.id = `file-${fileData.fileId}`;
        li.innerHTML = `
            <div style="display: flex; align-items: center; width: 100%;">
                <span style="font-size: 1.5em; margin-right: 10px;">📥</span>
                <div style="flex-grow: 1;">
                    File from <strong>${fileData.sender}</strong>: ${fileData.fileName}
                    <small style="display: block;">Awaiting your response...</small>
                </div>
                <div class="file-actions" style="margin-left: auto;">
                    <button class="accept-btn">Accept</button>
                    <button class="reject-btn">Reject</button>
                </div>
            </div>`;
        incomingFilesList.prepend(li);

        li.querySelector('.accept-btn').addEventListener('click', () => handleFileAction(fileData.fileId, 'accept'));
        li.querySelector('.reject-btn').addEventListener('click', () => handleFileAction(fileData.fileId, 'reject'));
    }

    function handleFileAction(fileId, action) {
        const fileItem = document.getElementById(`file-${fileId}`);
        if (!fileItem) return;

        if (action === 'accept') {
            window.location.href = `/api/files/download/${fileId}`;
            fileItem.innerHTML = `<div style="display: flex; align-items: center;"><span>✅</span> <div style="margin-left: 10px;"><strong>File accepted</strong> and is downloading.</div></div>`;
        } else {
            fileItem.innerHTML = `<div style="display: flex; align-items: center;"><span>❌</span> <div style="margin-left: 10px;"><strong>File rejected</strong>.</div></div>`;
        }
        setTimeout(() => fileItem.remove(), 5000);
    }
</script>
</body>
</html>
